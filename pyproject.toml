[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-llm-analyst"
version = "1.0.0"
description = "Finance analyst: NL-to-SQL over a DuckDB warehouse (rule engine + validated LLM fallback) with a prompt-tuning harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "google-genai>=1.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
